
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="mobile-web-app-capable" content="yes">

  <title>GAS Viewport Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    #app {
      flex: 1;
      min-height: 0;
      width: 100%;
      position: relative;
      background: #fff;
    }

    #gas-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }

    #debug {
      position: fixed;
      top: 5px;
      left: 5px;
      z-index: 99999;
      padding: 6px;
      font: 11px monospace;
      color: #fff;
      background: rgba(0,0,0,.75);
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="debug"></div>

  <main id="app">
    <iframe
      id="gas-frame"
      src="https://script.google.com/macros/s/AKfycbwk-qgkm6y7kJQMg8CfT46TQGE2ZIID1W1_NjScqE0/dev"
      allow="fullscreen"
    ></iframe>
  </main>

  <script>
    const debug = document.getElementById('debug');

    function updateDebug() {
      debug.innerHTML =
        'innerHeight: ' + window.innerHeight + '<br>' +
        'clientHeight: ' +
          document.documentElement.clientHeight + '<br>' +
        'visualHeight: ' +
          (window.visualViewport?.height || '-') + '<br>' +
        'visualOffset: ' +
          (window.visualViewport?.offsetTop || '-') + '<br>' +
        'scale: ' +
          (window.visualViewport?.scale || '-') + '<br>' +
        'screenHeight: ' + screen.height;
    }

    window.addEventListener('resize', updateDebug);

    window.visualViewport?.addEventListener(
      'resize',
      updateDebug
    );

    updateDebug();
  </script>

</body>
</html>
